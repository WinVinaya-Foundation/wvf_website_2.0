# WinVinaya Foundation - Virtual Host & Production Proxy Configuration
# Domain: winvinayafoundation.org / www.winvinayafoundation.org
# Location: /etc/nginx/sites-available/winvinayafoundation.org

# 1. HTTP Server — Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name winvinayafoundation.org www.winvinayafoundation.org;

    # Let's Encrypt Certbot Domain Verification Location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://winvinayafoundation.org$request_uri;
    }
}

# 2. WWW to non-WWW HTTPS Canonical Redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.winvinayafoundation.org;

    # SSL Certificate Paths (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/winvinayafoundation.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winvinayafoundation.org/privkey.pem;

    return 301 https://winvinayafoundation.org$request_uri;
}

# 3. HTTPS Server — Main Production Application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name winvinayafoundation.org;

    # Frontend Production Build Root Directory
    root /var/www/wvf_website_2.0/frontend/dist;
    index index.html;

    # Maximum Upload File Size Limit (PDFs, Images, Documents)
    client_max_body_size 35M;

    # SSL Certificate Paths (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/winvinayafoundation.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winvinayafoundation.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/winvinayafoundation.org/chain.pem;

    # Hardened SSL/TLS Protocol & Cipher Suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Cyber Security & Hardening Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Frontend SPA Route Handling ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (.js, .css, fonts, images, favicon)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Express Backend API Proxy ---
    location /api/ {
        # Anti-DDoS Rate Limiting
        limit_req zone=api_limit burst=25 nodelay;

        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Backend Auth Endpoint Limiter ---
    location /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:4000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Uploaded Static Documents & Media Proxy ---
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Block access to hidden files (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
