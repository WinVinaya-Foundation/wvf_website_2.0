name: WinVinaya Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - production

jobs:
  # -------------------------------------------------------------
  # Job 1: Continuous Integration (Audit & Build Verification)
  # -------------------------------------------------------------
  ci-audit:
    name: Build & Code Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Checks
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Validate Backend TypeScript & Prisma Schema
        run: |
          cd backend
          npx prisma validate
          npx prisma generate
          npx tsc --noEmit

      # Frontend Checks
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Production Assets
        run: |
          cd frontend
          npm run build

  # -------------------------------------------------------------
  # Job 2: Continuous Deployment (SSH to Production Server)
  # -------------------------------------------------------------
  cd-deploy:
    name: Production SSH Deployment
    needs: ci-audit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            set -e
            echo "Starting WinVinaya Automated Deployment..."

            cd /var/www/wvf_website

            # Pull latest main branch
            git fetch origin
            git reset --hard origin/main

            # Build Backend
            cd /var/www/wvf_website/backend
            npm ci
            npx prisma generate
            npx prisma db push
            npm run build

            # Build Frontend
            cd /var/www/wvf_website/frontend
            npm ci
            npm run build

            # Set static file permissions for Nginx
            sudo chown -R www-data:www-data /var/www/wvf_website/frontend/dist
            sudo chmod -R 755 /var/www/wvf_website/frontend/dist

            # Zero-downtime PM2 reload
            pm2 reload wvf-backend || pm2 start dist/index.js --name "wvf-backend"

            # Reload Nginx Web Server
            sudo systemctl reload nginx

            echo "WinVinaya Deployment Completed Successfully!"
